name: Deploy

# Build + push both images to Artifact Registry and deploy to Cloud Run on main,
# running DB migrations as a pre-deploy gate.
#
# GCP wiring (project infraq-greenberg, asia-south1):
#   - Auth: Workload Identity Federation — pool `github`, provider `github-oidc`,
#     restricted to this repository; deploys as pebble-deploy@ SA.
#   - Repo secrets: WORKLOAD_IDENTITY_PROVIDER, DEPLOY_SERVICE_ACCOUNT.
#   - Repo vars: GCP_PROJECT, CLOUDSQL_INSTANCE, DEPLOY_ENABLED, WORKER_URL
#     (set after the worker's first deploy), NEXT_PUBLIC_FIREBASE_* (client
#     config — public identifiers, safe as vars; they are inlined into the web
#     bundle at image build time).
#   - Runtime identities: pebble-web@ / pebble-worker@ (least-privilege — SQL
#     client, outputs-bucket access, signed-URL token creator on worker).
#
# The top-level `if: vars.DEPLOY_ENABLED == 'true'` guard keeps this a no-op
# until the repository variable is set.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token for Workload Identity Federation.
permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: asia-south1
  AR_REPO: pebble
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }} # $PROJECT:asia-south1:pebble-pg

jobs:
  deploy:
    # Guard: stays off until DEPLOY_ENABLED is explicitly set to "true".
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      # --- Build + push images ---
      # NEXT_PUBLIC_* are inlined into the client bundle by `next build`, so
      # they ride as build args, not runtime env.
      - name: Build & push web image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/web:${{ github.sha }}"
          docker build -f infra/Dockerfile.web -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            .
          docker push "$IMAGE"

      - name: Build & push worker image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/worker:${{ github.sha }}"
          docker build -f infra/Dockerfile.worker -t "$IMAGE" .
          docker push "$IMAGE"

      # --- Pre-deploy: run migrations, gate the rollout on success ---
      - name: Run DB migrations (pre-deploy job)
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/worker:${{ github.sha }}"
          gcloud run jobs deploy pebble-migrate \
            --image="$IMAGE" --region="$GCP_REGION" \
            --service-account="pebble-worker@$GCP_PROJECT.iam.gserviceaccount.com" \
            --set-cloudsql-instances="$CLOUDSQL_INSTANCE" \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest \
            --command=node --args=--import,tsx,node_modules/@pebble/db/src/migrate.ts
          gcloud run jobs execute pebble-migrate --region="$GCP_REGION" --wait

      # --- Deploy services (only reached if migrations succeeded) ---
      # Worker first so a fresh WORKER_URL is live before web rolls.
      - name: Deploy worker
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/worker:${{ github.sha }}"
          gcloud run deploy pebble-worker \
            --image="$IMAGE" --region="$GCP_REGION" --no-allow-unauthenticated \
            --service-account="pebble-worker@$GCP_PROJECT.iam.gserviceaccount.com" \
            --memory=2Gi --cpu=1 --min-instances=0 --max-instances=2 \
            --set-cloudsql-instances="$CLOUDSQL_INSTANCE" \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,RESEND_API_KEY=RESEND_API_KEY:latest \
            --set-env-vars="^|^STORAGE_BACKEND=gcs|GCS_BUCKET=$GCP_PROJECT-pebble-outputs|RENDER_PDF=1|DISPATCH_EMAIL_FROM=${{ vars.DISPATCH_EMAIL_FROM }}"

      - name: Deploy web
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/web:${{ github.sha }}"
          gcloud run deploy pebble-web \
            --image="$IMAGE" --region="$GCP_REGION" --allow-unauthenticated \
            --service-account="pebble-web@$GCP_PROJECT.iam.gserviceaccount.com" \
            --memory=1Gi --max-instances=3 \
            --set-cloudsql-instances="$CLOUDSQL_INSTANCE" \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest \
            --set-env-vars="^|^AUTH_MODE=firebase|FIREBASE_PROJECT_ID=$GCP_PROJECT|STORAGE_BACKEND=gcs|GCS_BUCKET=$GCP_PROJECT-pebble-outputs|WORKER_URL=${{ vars.WORKER_URL }}|PEBBLE_ALLOWED_EMAILS=${{ vars.PEBBLE_ALLOWED_EMAILS }}"
